# Keeps maps/index.json in step with the .damap files: on every push that
# changes a map, rebuild the list and commit it if it changed.
name: Update map index
on:
  push:
    branches: [main]
    paths: ['maps/**.damap']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/make-index.mjs
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet maps/index.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add maps/index.json
          git commit -m "Update map index"
          git push
